version: '3.9'

services:
  eduweconnect-role-allocation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduweconnect-role-allocation
    ports:
      - "7002:7002"
    env_file:
      - .env.${NODE_ENV:-development}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
