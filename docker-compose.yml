version: '3.9'

services:
  eduweconnect-role-allocation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduweconnect-role-allocation
    ports:
      - "7002:7002"
    env_file:
      - .env.${NODE_ENV:-development}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: eduweconnect-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Punith@1234"
      MYSQL_DATABASE: role-allocation-service
    ports:
      - "3311:3306"
    restart: unless-stopped
